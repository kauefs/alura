<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8>
    <meta    name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>InstaBytes</title>
    <link    rel ='shortcut icon'  type='image/x-icon' href=https://github.com/kauefs/StreamLit/raw/refs/heads/@/img/byte.ico>
    <meta    name='description' content='Exploring Inspiring Photos & Images.'>
    <link    rel ='stylesheet'     href=style.css>
</head>
<body>
    <header>
        <nav     class='navbar'>
            <div class='logo'>
                Insta<strong>Bytes</strong>
            </div>
            <div            class='nav-links'>
                <button     class='login-btn'   aria-label='Enter'>Enter</button>
                <a href='#' class='signup-link' aria-label='SubScribe'>SubScribe</a>
            </div>
        </nav>
    </header>
    <main        class='profile-container'>
        <section class='profile-header'>
            <img   src=https://github.com/kauefs/StreamLit/raw/refs/heads/@/img/EyE.png alt='ProFile Photo' class='profile-pic'/>
            <div class='profile-info'>
                <h1>@InstaBytes</h1>
                <p>15 publications · 888 followers · 333 following</p>
            </div>
        </section>
        <section class='image-grid'>
        </section>
    </main>
    <div     id='modal' class='modal'>
        <span         class='close'>x</span>
        <img          class='modal-content' id='modal-img'>
        <div id='caption'></div>
    </div>
    <script src=index.js type='module'></script>
</body>
</html>
