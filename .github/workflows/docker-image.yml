name: Docker Image CI

on:
  push:
    branches: [ "@" ]
  pull_request:
    branches: [ "@" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Docker Image
      run: docker compose up
