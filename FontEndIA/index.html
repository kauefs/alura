<!doctype html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content='width=device-width,initial-scale=1'>
    <title>StreamView</title>
    <!-- <link href=https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap rel=stylesheet> -->
    <link rel=stylesheet href=style.css>
</head>
<body>
    <main                              class=   'main-content'>
        <h1>StreamView</h1>
        <ul                            class='profile-list'>
            <!-- ProFile 1 -->
            <li                        class='profile-item'>
                <a href=catalogue.html class='profile'>
                    <figure            class= 'avatar-container'>
                        <span          class='profile-image theme' aria-hidden=true>
                            <span      class= 'avatar-icon'>
                                <img     src='assets/1.webp' alt='Fernanda ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='profile-name'>Fernanda</figcaption>
                    </figure>
                </a>
            </li>
            <!-- ProFile 2 -->
            <li                        class='profile-item'>
                <a href=catalogue.html class='profile'>
                    <figure            class= 'avatar-container'>
                        <span          class='profile-image theme' aria-hidden=true>
                            <span      class= 'avatar-icon'>
                                <img     src='assets/2.webp' alt='Guilherme ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='profile-name'>Guilherme</figcaption>
                    </figure>
                </a>
            </li>
            <!-- ProFile 3 -->
            <li                        class='profile-item'>
                <a href=catalogue.html class='profile'>
                    <figure            class= 'avatar-container'>
                        <span          class='profile-image theme' aria-hidden=true>
                            <span      class= 'avatar-icon'>
                                <img     src='assets/3.webp' alt='Thamiris ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='profile-name'>Thamiris</figcaption>
                    </figure>
                </a>
            </li>
            <!-- ProFile 4 -->
            <li                        class='profile-item'>
                <a href=catalogue.html class='profile'>
                    <figure            class= 'avatar-container'>
                        <span          class='profile-image theme' aria-hidden=true>
                            <span      class= 'avatar-icon'>
                                <img     src='assets/4.png' alt='KAUE ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='profile-name'>KAUE</figcaption>
                    </figure>
                </a>
            </li>
        </ul>
        <section                       class= 'manage'>
            <button type=button        class= 'manage-button'>Manage ProFiles</button>
        </section>
    </main>
    <script          src=index.js></script>
</body>
</html>
