<!doctype html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content='width=device-width,initial-scale=1'>
    <title>StreamView</title>
    <!-- <link href=https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap rel=stylesheet> -->
    <link rel=stylesheet href=style.css>
</head>
<body>
    <main                              class='MainContent'>
        <h1>StreamView</h1>
        <ul                            class='ProFileList'>
            <!-- ProFile 1 -->
            <li                        class='ProFileItem'>
                <a href=catalogue.html class='ProFile'>
                    <figure            class='AvatarContainer'>
                        <span          class='ProFileImage theme' aria-hidden=true>
                            <span      class='AvatarIcon'>
                                <img     src='assets/1.webp' alt='Fernanda ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='ProFileName'>Fernanda</figcaption>
                    </figure>
                </a>
            </li>
            <!-- ProFile 2 -->
            <li                        class='ProFileItem'>
                <a href=catalogue.html class='ProFile'>
                    <figure            class='AvatarContainer'>
                        <span          class='ProFileImage theme' aria-hidden=true>
                            <span      class='AvatarIcon'>
                                <img     src='assets/2.webp' alt='Guilherme ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='ProFileName'>Guilherme</figcaption>
                    </figure>
                </a>
            </li>
            <!-- ProFile 3 -->
            <li                        class='ProFileItem'>
                <a href=catalogue.html class='ProFile'>
                    <figure            class='AvatarContainer'>
                        <span          class='ProFileImage theme' aria-hidden=true>
                            <span      class='AvatarIcon'>
                                <img     src='assets/3.webp' alt='Thamiris ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='ProfFileName'>Thamiris</figcaption>
                    </figure>
                </a>
            </li>
            <!-- ProFile 4 -->
            <li                        class='ProFileItem'>
                <a href=catalogue.html class='ProFile'>
                    <figure            class='AvatarContainer'>
                        <span          class='ProFileImage theme' aria-hidden=true>
                            <span      class='AvatarIcon'>
                                <img     src='assets/4.png' alt='KAUE ProFile' width=128 height=128>
                            </span>
                        </span>
                        <figcaption    class='ProFileName'>KAUE</figcaption>
                    </figure>
                </a>
            </li>
        </ul>
        <section                       class='manage'>
            <button type=button        class='manageButton'>Manage ProFiles</button>
        </section>
    </main>
    <script          src=index.js></script>
</body>
</html>
